apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: graphql-node
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: graphql-node
spec:
  replicas: 1
  strategy:
    # A single ReadWriteOnce PVC can't be mounted by two pods at once — a
    # rolling update would leave the new pod stuck Pending. Recreate the one
    # pod instead (brief downtime on redeploy, acceptable for this demo DB).
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: graphql-node-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: graphql-node-config
                  key: DATABASE_NAME
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: graphql-node-secrets
                  key: DATABASE_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: graphql-node-secrets
                  key: DATABASE_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ['sh', '-c', 'mysqladmin ping -h localhost -uroot -p"$MYSQL_ROOT_PASSWORD"']
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ['sh', '-c', 'mysqladmin ping -h localhost -uroot -p"$MYSQL_ROOT_PASSWORD"']
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: graphql-node
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
